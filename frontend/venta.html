<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Punto de venta · Moto MR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body data-page="venta">
<main>
<h1>Punto de venta</h1>
<div class="pos">
<section>
<label>Buscar producto<input id="q" type="search" placeholder="Nombre o código"></label>
<div class="cat" id="cat"></div>
</section>
<section class="panel carrito" aria-label="Carrito de venta">
<h2>Venta actual</h2>
<label>Cliente<select id="cliente"></select></label>
<div id="lineas"></div>
<div class="tot"><span>Subtotal</span><span id="sub"></span><span>IVA 19%</span><span id="iva"></span><strong>Total</strong><strong class="g" id="tot"></strong></div>
<button class="btn ok" id="cobrar" style="width:100%" disabled>Cobrar y facturar</button>
</section>
</div>
</main>
<script src="js/app.js"></script>
</body>
</html>

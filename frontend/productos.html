<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Productos · Moto MR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body data-page="productos">
<main>
<h1>Productos</h1>
<div class="bar">
<label class="grow">Buscar producto<input id="q" type="search" placeholder="Nombre o código"></label>
<label>Categoría<select id="cat"><option value="">Todas</option></select></label>
<button class="btn" id="nuevo" style="margin-bottom:.8rem">Agregar producto</button>
</div>
<div class="tablewrap"><table><thead><tr><th>Código</th><th>Producto</th><th>Categoría</th><th class="num">Precio</th><th class="num">Stock</th></tr></thead><tbody id="filas"></tbody></table></div>
</main>
<script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar · Moto MR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body data-page="login">
<div class="login">
<section class="lado"><h1>Repuestos para moto, ventas sin enredos.</h1><p>Sistema de punto de venta de Moto MR: factura, controla el inventario y atiende a tus clientes desde un solo lugar.</p></section>
<section class="forma"><form id="login" novalidate>
<h2>Ingresar al sistema</h2>
<label>Correo electrónico<input id="correo" type="text" autocomplete="username" value="admin@motomr.co"></label>
<label>Contraseña<input id="clave" type="password" autocomplete="current-password" value="1234"></label>
<p id="error" class="err" role="alert"></p>
<button class="btn" style="width:100%">Ingresar</button>
<p class="nota">Datos de prueba: admin@motomr.co · contraseña 1234</p>
</form></section></div>
<script src="js/app.js"></script>
</body>
</html>
